<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home - Mamazon</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../public/css/style.css" />
  </head>
  <body data-page="home">
    <div id="site-header"></div>

    <header class="page-header py-4">
      <div class="container">
        <h1 class="h4 mb-1">Welcome</h1>
      </div>
    </header>

    <main class="container py-2">
      <section class="home-hero fade-in-up">
        <div class="row align-items-center g-3">
          <div class="col-md-7">
            <h2 class="mb-2">Shop Daily Essentials</h2>
            <p class="mb-3 text-muted">Browse products, add to cart, and explore a simple full stack shopping flow.</p>
            <a class="btn btn-warning" href="/products">Go To Products</a>
          </div>
          <div class="col-md-5">
          </div>
        </div>
      </section>

      <section class="mt-4">
        <h2 class="h5 mb-3">Featured Categories</h2>
        <div class="row g-3">
          <div class="col-md-4 fade-in-up delay-1">
            <div class="home-mini-card">
              <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=800&q=80" alt="smart watch" class="w-100" />
              <p class="mb-0 mt-2">Smart Devices</p>
            </div>
          </div>
          <div class="col-md-4 fade-in-up delay-2">
            <div class="home-mini-card">
              <img src="https://images.unsplash.com/photo-1587829741301-dc798b83add3?auto=format&fit=crop&w=800&q=80" alt="keyboard" class="w-100" />
              <p class="mb-0 mt-2">Computer Accessories</p>
            </div>
          </div>
          <div class="col-md-4 fade-in-up delay-3">
            <div class="home-mini-card">
              <img src="https://images.unsplash.com/photo-1589003077984-894e133dabab?auto=format&fit=crop&w=800&q=80" alt="speaker" class="w-100" />
              <p class="mb-0 mt-2">Audio Products</p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>

    <script src="../public/js/layout.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
