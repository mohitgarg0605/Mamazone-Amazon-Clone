<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - Mamazon</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../public/css/style.css" />
  </head>
  <body data-page="contact">
    <div id="site-header"></div>

    <header class="page-header py-4">
      <div class="container">
        <h1 class="h4 mb-1">Contact Us</h1>
      </div>
    </header>

    <main class="container">
      <div class="card p-3">
        <h2 class="h5">Send Message</h2>
        <form id="contactform">
          <div class="mb-2">
            <label class="form-label">Name</label>
            <input id="contactname" class="form-control" type="text" placeholder="Enter name" />
          </div>
          <div class="mb-2">
            <label class="form-label">Email</label>
            <input id="contactemail" class="form-control" type="email" placeholder="Enter email" />
          </div>
          <div class="mb-2">
            <label class="form-label">Message</label>
            <textarea id="contactmessage" class="form-control" rows="3" placeholder="Write message"></textarea>
          </div>
          <button class="btn btn-warning" type="submit">Submit</button>
        </form>
        <p id="contactstatus" class="small mt-2 mb-0"></p>
      </div>
    </main>

    <div id="site-footer"></div>

    <script src="../public/js/layout.js"></script>
    <script src="../public/js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
