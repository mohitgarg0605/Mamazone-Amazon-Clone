<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products - Mamazon</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../public/css/style.css" />
  </head>
  <body data-page="products">
    <div id="site-header"></div>

    <header class="page-header py-4 fade-in-up">
      <div class="container">
        <h1 class="h4 mb-1">Product List</h1>
        <p class="text-muted mb-0">All available items</p>
      </div>
    </header>

    <main class="container fade-in-up delay-1">
      <h2>Products</h2>
      <section id="productgrid" class="product-grid"></section>

      <section id="cart" class="cart-section mt-4 fade-in-up delay-2">
        <h2 class="h5">Cart Section</h2>
        <p class="mb-2">Items in cart: <span id="cartcount2">0</span></p>
        <ul id="cartlist" class="mb-0"></ul>
      </section>
    </main>

    <div id="site-footer"></div>

    <script src="../public/js/layout.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../public/js/app.js"></script>
  </body>
</html>
